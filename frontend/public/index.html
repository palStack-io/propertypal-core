<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" type="image/png" href="%PUBLIC_URL%/propertyPal.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0b1524" />
    <meta
      name="description"
      content="propertyPal - Your Complete Property Management Solution | Part of palStack"
    />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/propertyPal.png" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <!-- Theme init — runs before React to prevent flash of wrong theme -->
    <script>
      (function() {
        var saved = localStorage.getItem('palstack-theme') || 'dark';
        document.documentElement.setAttribute('data-theme', saved);
        var themeColor = saved === 'light' ? '#e8f4fb' : '#0b1524';
        document.querySelector('meta[name="theme-color"]').setAttribute('content', themeColor);
      })();
    </script>
    <!-- Runtime config -->
    <script src="%PUBLIC_URL%/static/js/config.js"></script>
    <title>propertyPal - Property Management Made Simple | palStack</title>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
  </body>
</html>
